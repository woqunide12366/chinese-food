services:
  app:
    build: .
    container_name: chinese-food-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/data.db
      - PORT=3001
    volumes:
      - ./data:/data
      - ./uploads:/app/server/uploads
    networks:
      - chinese-food-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/submissions', (r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: chinese-food-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # 如需 HTTPS，取消注释并配置证书
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # 如需 HTTPS，挂载证书目录
    depends_on:
      app:
        condition: service_healthy
    networks:
      - chinese-food-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chinese-food-net:
    driver: bridge
